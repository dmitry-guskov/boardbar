<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<style>
:root{--bg:#fbfbfa;--card:#f1f0ec;--line:rgba(0,0,0,.09);--text:#1d1d1b;--sub:#5f5e5a;--muted:#8a8984;--warn-bg:#faeeda;--warn:#854f0b;--bad-bg:#fcebeb;--bad:#a32d2d;--ok:#3b6d11;--accent:#185fa5;
--a1:#7F77DD;--a2:#1D9E75;--a3:#D85A30;--a4:#888780;--a5:#378ADD;--a6:#D4537E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1f1e;--card:#2a2a28;--line:rgba(255,255,255,.1);--text:#ecebe6;--sub:#b4b2a9;--muted:#888780;--warn-bg:#412402;--warn:#fac775;--bad-bg:#501313;--bad:#f7c1c1;--ok:#97c459;--accent:#85b7eb;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1f1e;--card:#2a2a28;--line:rgba(255,255,255,.1);--text:#ecebe6;--sub:#b4b2a9;--muted:#888780;--warn-bg:#412402;--warn:#fac775;--bad-bg:#501313;--bad:#f7c1c1;--ok:#97c459;--accent:#85b7eb;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-user-select:none;user-select:none}
body{padding:12px 14px 10px;max-width:560px;margin:0 auto}
h2{font-size:12px;font-weight:500;color:var(--sub);margin:14px 0 4px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:7px;padding:2px;margin:8px 0 2px}
.tabs button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;padding:4px;border-radius:5px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row.link{cursor:pointer}.row.link:hover .t{color:var(--accent)}
.sub{font-size:11.5px;color:var(--muted)}
.pill{font-size:11px;padding:1px 7px;border-radius:6px;white-space:nowrap;background:var(--card);color:var(--sub)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.tag{font-size:10.5px;color:var(--muted);border:.5px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px;white-space:nowrap}
.banner{border-radius:7px;padding:7px 10px;margin-bottom:8px;font-size:12px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.box{background:var(--card);border-radius:8px;padding:2px 10px}
details summary{cursor:pointer;color:var(--sub);font-size:12px;margin-top:12px}
.foot{margin-top:12px;padding-top:8px;border-top:.5px solid var(--line);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.foot a{color:var(--sub);cursor:pointer;text-decoration:none}.foot a:hover{color:var(--accent)}
.cov{display:inline-flex;align-items:center;gap:4px}
.tl{position:relative}
.lane{display:flex;min-height:46px;border-bottom:.5px solid var(--line)}
.lane .nm{width:86px;white-space:nowrap;font-size:12px;padding-top:4px;display:flex;gap:5px;align-items:baseline}
.lane .tr{flex:1;position:relative}
.mk{position:absolute;top:4px;transform:translateX(-5px);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.mk.flip{flex-direction:row-reverse;transform:translateX(calc(-100% + 5px))}
.mk>.m{width:10px;height:10px;flex:none}
.mk:hover .lb{color:var(--text)}
.mk .lb{font-size:10.5px;color:var(--sub);max-width:96px;overflow:hidden;text-overflow:ellipsis}
.bar{position:absolute;height:6px;border-radius:3px}
.hb{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.hb .n{width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{flex:1;height:5px;border-radius:3px;background:var(--card)}
.hb .v{width:62px;text-align:right;color:var(--muted);font-size:11px}
.empty{color:var(--muted);padding:6px 0;font-size:12px}
.isfull .lane .nm,.isfull .nmw{width:150px}.nmw{width:86px;flex:none}
.isfull .mk .lb{max-width:170px}
body.isfull{max-width:none;padding:18px 28px 14px}
.full{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,1.8fr) minmax(260px,1fr);gap:28px;align-items:start;margin-top:10px}
.full section{min-width:0}
@media (max-width:1150px){.full{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}.full section:nth-child(3){grid-column:1/-1}}
.fhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.fhead .brief{font-size:14px;max-width:110ch;margin-top:4px}
.btns{display:flex;gap:6px;flex:none}
.btn{border:.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--sub)}
.iconbtn{white-space:nowrap;flex:none;border:0;background:transparent;color:var(--sub);cursor:pointer;font:inherit;font-size:12px;padding:0 2px}
.iconbtn:hover{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0;align-items:center}
.chip{border:.5px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-size:11.5px;padding:2px 9px;border-radius:12px;cursor:pointer}
.chip.on{background:var(--card);color:var(--text);border-color:var(--sub)}
.tr2{display:grid;grid-template-columns:10px minmax(0,1fr) 66px 44px 150px;gap:8px;align-items:center;padding:5px 0;border-bottom:.5px solid var(--line)}
.tr2.head{font-size:11px;color:var(--muted);border-bottom:.5px solid var(--line)}
.tr2.link{cursor:pointer}.tr2.link:hover .tt{color:var(--accent)}
.tt{min-width:0}
.st{font-size:11px;color:var(--sub)}.st-unknown{color:var(--warn)}.st-waiting{color:var(--accent)}.st-doing{color:var(--ok)}
.age,.dd{text-align:right;font-size:11px;color:var(--muted)}
.hbx{padding:4px 0 6px;border-bottom:.5px solid var(--line)}
.hbx .meta{padding-left:16px;font-size:11.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cvl{display:grid;grid-template-columns:10px 120px minmax(0,1fr);gap:6px;font-size:11.5px;padding:3px 0;color:var(--sub)}
.q{margin-top:6px;font-size:13px;color:var(--sub)}
a.ext{color:var(--accent);text-decoration:none;cursor:pointer}
.now{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--bad);pointer-events:none}
.grid{position:absolute;top:0;bottom:0;border-left:.5px solid var(--line);pointer-events:none}
#hov{position:fixed;z-index:10;max-width:320px;background:var(--bg);border:.5px solid var(--sub);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#hov .ht{font-weight:600;font-size:12.5px;margin-bottom:2px}
#hov .hl{color:var(--sub)}
.tag.sg{border-style:dashed}
.tag.pend{color:var(--accent);border-color:var(--accent)}
.tag.conf{color:var(--warn);border-color:var(--warn)}
.tr2{grid-template-columns:10px minmax(0,1fr) 66px 44px 150px 104px}
select.fb{font:inherit;font-size:11px;color:var(--sub);background:var(--card);border:.5px solid var(--line);border-radius:5px;padding:1px 2px;width:100%}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 12px;border-radius:7px;font-size:12px;z-index:11}
#toast.err{background:var(--bad-bg);color:var(--bad)}
.child .n{padding-left:12px}
.tri{max-width:1280px;margin:0 auto}
.tri>.fhead,.tri>.chips,.tri>.prog,.tri>.tbtns,.tri>.tnotebar{max-width:660px;margin-left:auto;margin-right:auto}
.prog{height:3px;background:var(--card);border-radius:2px;margin:12px 0 14px}.prog>div{height:3px;background:var(--accent);border-radius:2px;transition:width .2s}
.wheel{position:relative;height:320px;overflow:hidden;perspective:1600px;margin-top:4px}
.wheel .tcard{position:absolute;left:50%;top:50%;width:min(600px,52%);max-height:440px;overflow:hidden;background:var(--card);border-radius:14px;padding:20px 24px;cursor:pointer;transform-origin:50% 50%;will-change:transform,opacity;box-shadow:0 1px 0 var(--line)}
.wheel.snap .tcard{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.wheel .tcard.cur{cursor:default;outline:.5px solid var(--sub);max-height:none}
.wheel .tcard:not(.cur) .det{display:none}
.wheel .tcard:not(.cur){padding:14px 18px;width:min(280px,24%)}.wheel .tcard:not(.cur) .ttl{font-size:15px;margin:4px 0 0}
.wheel .tcard:not(.cur) .tbadge{position:static;margin-bottom:6px}
.tcard .ttl{font-size:21px;font-weight:600;line-height:1.3;margin:6px 0 8px;text-wrap:balance}
.twhy{font-size:13.5px;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard.cur .twhy{-webkit-line-clamp:unset;display:block}
.tbadge{position:absolute;top:14px;right:16px;display:flex;gap:6px}
.pill.okp{background:var(--card);color:var(--ok);border:.5px solid var(--ok)}
.tnotebar{max-width:640px;margin:8px auto 0}.tnotebar input{width:100%;font:inherit;font-size:13px;color:var(--text);background:var(--card);border:.5px solid var(--accent);border-radius:8px;padding:7px 10px;user-select:text}
.box .row .sub{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
details.brief{margin:0 0 6px}details.brief summary{margin-top:0}
@media (prefers-reduced-motion:reduce){.wheel.snap .tcard{transition:none}}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.tb-done{border-color:var(--ok)}.tb-cancelled{border-color:var(--bad)}.tb-todo{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
kbd{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;border:.5px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);margin-left:4px}
@media (prefers-reduced-motion:reduce){.prog>div{transition:none}}
.cbtn{border:.5px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-size:10.5px;padding:0 6px;border-radius:5px;cursor:pointer;opacity:0;margin-left:6px;flex:none}
.row{position:relative}.row>.cbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--bg);padding:2px 8px;margin:0}
.box .row>.cbtn{background:var(--card)}
.row:hover .cbtn,.tr2:hover .cbtn,.cbtn:focus{opacity:1}
.cbtn:hover{color:var(--accent);border-color:var(--accent)}
#cbox{position:fixed;z-index:12;background:var(--bg);border:.5px solid var(--sub);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:12.5px}
#cbox .ht{font-weight:600;margin-bottom:6px}
#cbox textarea{width:100%;min-height:70px;margin-top:6px;font:inherit;font-size:13px;color:var(--text);background:var(--card);border:.5px solid var(--line);border-radius:7px;padding:6px 8px;resize:vertical;user-select:text}
#cbox .err{color:var(--bad);font-size:12px;margin-top:6px}
.cmt{border-left:2px solid var(--accent);padding:2px 0 2px 8px;margin:6px 0;font-size:12.5px;border-radius:0}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<script>
const PALETTE=['var(--a1)','var(--a2)','var(--a3)','var(--a4)','var(--a5)','var(--a6)'];
let payload=null,tab='today',fArea='all',fState='open',fSort='due',localFull=false,HOV=[];
try{tab=localStorage.getItem('tab')||'today'}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=s=>{const d=new Date(s.length===10?s+'T12:00:00':s);return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const diff=s=>Math.round((day(s)-today())/864e5);
const fmt=s=>day(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtTime=s=>new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const rel=s=>{const n=diff(s);return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n>0?'in '+n+'d':(-n)+'d ago'};
const APP=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.app);
const post=m=>{try{window.webkit.messageHandlers.app.postMessage(m)}catch(e){}};
const isFull=()=>window.BOARD_MODE?window.BOARD_MODE==='full':(localFull||innerWidth>=900);
const OPEN=t=>!['done','cancelled','deferred'].includes(t.state);
const SUGG=t=>t.basis==='recommendation';
const ACTIONS=[['done','Done'],['todo','To do'],['doing','Doing'],['waiting','Waiting'],['cancelled','Cancel task']];
const LEGEND='<div class="sub" style="margin:5px 0 4px">◆ deadline · ● event · ■ milestone · thick bar in progress · faint bar waiting · red line today · hover for details</div>';
function color(b,a){const k=Object.keys((b&&b.areas)||{});const i=k.indexOf(a);return i<0?'var(--a5)':PALETTE[i%PALETTE.length]}
function areaLabel(b,a){return (b.areas&&b.areas[a]&&b.areas[a].label)||a||'Other'}

function feedbackFor(id){
  const evs=((payload&&payload.feedback)||[]).filter(e=>e.task_id===id&&e.action!=='comment').sort((x,y)=>String(x.recorded_at).localeCompare(String(y.recorded_at)));
  if(!evs.length)return null;const ev=evs[evs.length-1];
  const rc=((payload.board&&payload.board.feedback_receipts)||{})[ev.event_id];return {ev,rc}}
function fbTag(t){const f=feedbackFor(t.id);if(!f)return '';
  const lbl=(ACTIONS.find(a=>a[0]===f.ev.action)||[0,f.ev.action])[1].toLowerCase();
  if(!f.rc)return `<span class="tag pend" title="Saved ${esc(fmtTime(f.ev.recorded_at))}; applies at the next curator run">you: ${esc(lbl)} · pending</span>`;
  if(f.rc.status==='conflict')return `<span class="tag conf" title="${esc(f.rc.reason||'')}">you: ${esc(lbl)} · conflict</span>`;
  if(f.rc.status==='rejected')return `<span class="tag conf" title="${esc(f.rc.reason||'')}">you: ${esc(lbl)} · not applied</span>`;
  return ''}
function commentsFor(id){const rc=(payload&&payload.board&&payload.board.feedback_receipts)||{};
  return ((payload&&payload.feedback)||[]).filter(e=>e.task_id===id&&e.action==='comment').sort((x,y)=>String(x.recorded_at).localeCompare(String(y.recorded_at))).map(e=>({e,rc:rc[e.event_id]}))}
function nextRun(){const b=payload&&payload.board;return b&&b.next_refresh_at?new Date(b.next_refresh_at).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'}):'the next curator run'}
function commentTag(t){const cs=commentsFor(t.id);if(!cs.length)return '';const pend=cs.filter(c=>!c.rc).length;
  return pend?`<span class="tag pend" title="Waiting for the curator's next run (${esc(nextRun())})">${pend} comment${pend>1?'s':''} · for review</span>`:`<span class="tag" title="Reviewed by the curator">comment reviewed</span>`}
function cbtn(t){return payload&&payload.feedbackEnabled?`<button class="cbtn" data-comment="${esc(t.id)}" title="Leave a comment for the curator">Comment</button>`:''}
function closeComment(){const p=document.getElementById('cbox');if(p)p.hidden=true}
function openComment(id,anchor){const b=payload.board,t=(b.tasks||[]).find(x=>x.id===id);if(!t)return;
  let p=document.getElementById('cbox');if(!p){p=document.createElement('div');p.id='cbox';document.body.appendChild(p)}
  const cs=commentsFor(id);
  p.innerHTML=`<div class="ht"><span class="dot" style="background:${color(b,t.area)};margin-right:6px"></span>${esc(t.title)}</div>
    ${cs.map(c=>`<div class="cmt"><div>${esc(c.e.note)}</div><div class="sub">${esc(fmtTime(c.e.recorded_at))} · ${c.rc?`reviewed ${esc(fmtTime(c.rc.processed_at))}${c.rc.reply||c.rc.reason?' — '+esc(c.rc.reply||c.rc.reason):''}`:`for review at ${esc(nextRun())}`}</div></div>`).join('')}
    <textarea id="ctext" placeholder="For example: already paid on Oct 25, or: waiting for my advisor's reply first"></textarea>
    <div class="sub" style="margin:4px 0 8px">Shift+Enter for a new line. The curator reads this at its next run (${esc(nextRun())}). It doesn't change the status or edit your notes.</div>
    <div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" id="ccancel">Cancel <kbd>Esc</kbd></button><button class="btn tb-todo" id="csave">Save comment <kbd>↵</kbd></button></div>
    <div class="err" id="cerr" hidden></div>`;
  p.hidden=false;
  const r=anchor?anchor.getBoundingClientRect():{left:innerWidth/2-170,bottom:120,top:120};const w=Math.min(360,innerWidth-16);p.style.width=w+'px';
  const h=p.offsetHeight;let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);
  p.style.left=x+'px';p.style.top=y+'px';
  const ta=document.getElementById('ctext');ta.focus();
  const save=()=>{const note=ta.value.trim();const er=document.getElementById('cerr');
    if(!note){er.textContent='Write a comment first.';er.hidden=false;return}
    if(!APP){er.textContent='Comments need the BoardBar app.';er.hidden=false;return}
    window._pendingComment=true;post({feedback:{task_id:t.id,action:'comment',note,previous_state:t.state,snapshot_generated_at:b.generated_at}})};
  ta.oninput=()=>{document.getElementById('cerr').hidden=true};
  ta.onkeydown=ev=>{if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();closeComment()}else if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();save()}};
  document.getElementById('csave').onclick=save;document.getElementById('ccancel').onclick=closeComment}

function dueChip(t){
  const st=t.state;
  if(t.due){const n=diff(t.due);
    if(n<0)return st==='done'?`<span class="pill">done</span>`:st==='unknown'?`<span class="pill">was due ${fmt(t.due)}</span>`:`<span class="pill bad">past due ${fmt(t.due)}</span>`;
    return `<span class="pill ${n<=3?'warn':''}">${n===0?'today':n===1?'tomorrow':'in '+n+'d'} · ${fmt(t.due)}</span>`}
  if(t.event_at){const n=diff(t.event_at);return `<span class="pill">event ${fmt(t.event_at)}${n>=0?' · '+n+'d':''}</span>`}
  if(t.state==='waiting'&&t.since)return `<span class="sub">${-diff(t.since)}d</span>`;
  if(t.open_since)return `<span class="sub">open ${-diff(t.open_since)}d</span>`;
  return ''}
function tags(t,noStatus){let s='';
  if(SUGG(t))s+='<span class="tag sg">suggested</span>';
  if(t.basis==='inference')s+='<span class="tag">inferred</span>';
  if(t.state==='unknown'&&!noStatus)s+='<span class="tag">status ?</span>';
  if(t.priority==='high')s+='<span class="tag">high</span>';
  return s+fbTag(t)+commentTag(t)}
function tip(t){const p=[];if(t.why)p.push(t.why);if(t.status_as_of)p.push('Status as of '+fmt(t.status_as_of));
  (t.sources||[]).forEach(s=>p.push('Source: '+s.ref+(s.date?' ('+fmt(s.date)+')':'')+(s.confidence?' · '+s.confidence:'')));
  if(t.note_path&&APP)p.push('Click to open in Obsidian');return esc(p.join('\n'))}
function row(b,t,extra){return `<div class="row ${t.note_path&&APP?'link':''}" title="${tip(t)}" ${t.note_path&&APP?`data-note="${esc(t.note_path)}"`:''}>
  <span class="dot" style="background:${color(b,t.area)}"></span>
  <div class="t">${esc(t.title)}${tags(t)}${extra||''}</div>${cbtn(t)}${dueChip(t)}</div>`}
function healthBanner(h,b){
  if(!h||h.state==='ok')return '';
  return `<div class="banner ${h.state==='stale'?'warn':'bad'}">${esc(h.message||h.state)}${b?' · showing snapshot from '+fmtTime(b.generated_at):''}</div>`}
function questionHTML(b){const q=b.question;if(!q||!q.text)return '';
  if(q.decision_id&&(b.decisions||[]).some(d=>d.id===q.decision_id))return '';
  return `<div class="q" title="${esc(q.why||'')}">Question: ${esc(q.text)}</div>`}

function vToday(b,o={}){
  const tasks=b.tasks||[],byId=Object.fromEntries(tasks.map(t=>[t.id,t]));
  const top=(b.top_ids||[]).map(i=>byId[i]).filter(Boolean).slice(0,3);
  const topSet=new Set(top.map(t=>t.id));
  const pool=tasks.filter(t=>!topSet.has(t.id)&&!SUGG(t));
  const upcoming=pool.filter(t=>OPEN(t)&&(t.due||t.event_at)&&diff(t.due||t.event_at)<=28&&diff(t.due||t.event_at)>=-14).sort((x,y)=>day(x.due||x.event_at)-day(y.due||y.event_at));
  const waiting=pool.filter(t=>t.state==='waiting').sort((x,y)=>day(x.since||'2100-01-01')-day(y.since||'2100-01-01'));
  const doing=pool.filter(t=>t.state==='doing');
  const suggestions=tasks.filter(t=>OPEN(t)&&SUGG(t)&&!topSet.has(t.id));
  const shown=new Set([...upcoming,...waiting,...doing].map(t=>t.id));
  const rest=pool.filter(t=>OPEN(t)&&!shown.has(t.id));
  const doneRecent=tasks.filter(t=>t.state==='done'&&t.status_as_of&&diff(t.status_as_of)>=-2);
  let h='';
  if(b.brief&&!o.noBrief)h+=`<div style="font-size:13.5px;margin:6px 0 2px">${esc(b.brief)}</div>`;
  if(!o.noBrief)h+=questionHTML(b);
  if(!o.noDecisions)h+=decisionsHTML(b,true);
  h+=`<h2><span>Today</span><span>${top.length}</span></h2><div class="box">${top.length?top.map(t=>row(b,t,t.why?`<div class="sub">${esc(t.why)}</div>`:'')).join(''):'<div class="empty">Nothing picked for today.</div>'}</div>`;
  if(doing.length)h+=`<h2><span>In progress</span><span>${doing.length}</span></h2>${doing.map(t=>row(b,t)).join('')}`;
  if(upcoming.length)h+=`<h2><span>Coming up · 4 weeks</span><span>${upcoming.length}</span></h2>${upcoming.map(t=>row(b,t)).join('')}`;
  if(waiting.length)h+=`<h2><span>Waiting on</span><span>${waiting.length}</span></h2>${waiting.map(t=>row(b,t,t.waiting_on?`<span class="sub"> · ${esc(t.waiting_on)}</span>`:'')).join('')}`;
  if(suggestions.length)h+=`<h2><span title="Suggested next steps, not commitments">Suggestions</span><span>${suggestions.length}</span></h2>${suggestions.map(t=>row(b,t,t.why?`<div class="sub">${esc(t.why)}</div>`:'')).join('')}`;
  if(doneRecent.length)h+=`<h2><span>Recently done</span><span>${doneRecent.length}</span></h2>${doneRecent.map(t=>row(b,t)).join('')}`;
  if(rest.length&&!o.noRest)h+=`<details><summary>Everything else open (${rest.length})</summary>${rest.map(t=>row(b,t)).join('')}</details>`;
  return h}

function hovTask(b,t){const when=t.due||t.event_at;
  return {title:t.title,color:color(b,t.area),lines:[
    when?`${t.due?'Due':'Event'} ${fmt(when)} (${rel(when)})`:'',
    `${t.state==='unknown'?'Status unknown':t.state}${t.status_as_of?' · as of '+fmt(t.status_as_of):''}${SUGG(t)?' · suggested, not committed':t.basis==='inference'?' · inferred':''}`,
    t.waiting_on?`Waiting on ${t.waiting_on}${t.since?' since '+fmt(t.since):''}`:'',
    t.why||'',
    ...commentsFor(t.id).slice(-1).map(c=>`Your comment: ${c.e.note}${c.rc?' (reviewed)':' (for review)'}`),
    ...(t.sources||[]).map(s=>'Source: '+s.ref+(s.date?' · '+fmt(s.date):'')),
    t.note_path&&APP?'Click to open in Obsidian':''].filter(Boolean),note:t.note_path}}
function timelineHTML(b,o){
  const tasks=(b.tasks||[]).filter(t=>!['cancelled','deferred'].includes(t.state));
  const wk=o.weeks,span=wk*7;
  const t0=today();const start=new Date(t0);start.setDate(start.getDate()-((start.getDay()+6)%7)-7*o.back);
  const pct=s=>Math.max(0,Math.min(100,(day(s)-start)/864e5/span*100));
  const inWin=s=>day(s)>=start&&(day(s)-start)/864e5<=span;
  const nowP=(t0-start)/864e5/span*100;
  const areas=Object.keys(b.areas||{});
  tasks.forEach(t=>{if(t.area&&!areas.includes(t.area))areas.push(t.area)});
  let head='',grid='';for(let i=0;i<wk;i++){const d=new Date(start);d.setDate(d.getDate()+7*i);
    head+=`<span class="sub" style="position:absolute;left:calc(${i/wk*100}% + 3px);top:-17px;white-space:nowrap;font-size:10.5px">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>`;
    grid+=`<div class="grid" style="left:${i/wk*100}%"></div>`}
  const mk=(p,shape,col,hv,label,faded)=>{HOV.push(hv);return `<div class="mk" data-x="${p}" data-hi="${HOV.length-1}" style="left:${p}%;${faded?'opacity:.45':''}"><div class="m" style="${shape};background:${col}"></div><span class="lb">${esc(label)}</span></div>`};
  const bar=(l,w,col,kind,hv)=>{HOV.push(hv);return `<div class="bar ${kind}" data-hi="${HOV.length-1}" style="left:${l}%;width:${w}%;background:${col};${kind==='waitb'?'opacity:.35':''}"></div>`};
  const lane=(nm,inner)=>`<div class="lane">${nm}<div class="tr">${grid}<div class="now" style="left:${nowP}%"></div>${inner}</div></div>`;
  const out=areas.map(a=>{let m='';const c=color(b,a);
    tasks.filter(t=>t.area===a).forEach(t=>{
      if(t.state==='waiting'&&t.since){const l=pct(t.since);m+=bar(l,Math.max(1,nowP-l),c,'waitb',hovTask(b,t))}
      if(t.state==='doing'){const l=Math.min(pct(t.status_as_of||t0.toISOString()),nowP-2);m+=bar(l,Math.max(2,nowP-l),c,'doingb',hovTask(b,t))}
      const when=t.due||t.event_at;if(!when||!inWin(when))return;
      const past=diff(when)<0&&!['done','unknown'].includes(t.state);
      m+=mk(pct(when),t.due?'transform:rotate(45deg) scale(.85)':'border-radius:50%',past?'var(--bad)':c,hovTask(b,t),t.short||t.title,t.state==='done'||SUGG(t))});
    return lane(`<div class="nm"><span class="dot" style="background:${c}"></span>${esc(areaLabel(b,a))}</div>`,m)});
  if(o.milestones)(b.projects||[]).filter(p=>(p.milestones||[]).some(x=>x.date&&inWin(x.date))).forEach(p=>{const c=color(b,p.area);
    const m=p.milestones.filter(x=>x.date&&inWin(x.date)).map(x=>mk(pct(x.date),'border-radius:2px',c,{title:x.title,color:c,lines:[`${p.name} · milestone`,`${x.state==='achieved'?'Achieved'+(x.achieved_at?' '+fmt(x.achieved_at):''):'Target '+fmt(x.date)+' ('+rel(x.date)+')'} · ${x.state}`,...(x.sources||[]).map(s=>'Source: '+s.ref)]},x.title,x.state==='achieved'||x.state==='cancelled')).join('');
    out.push(lane(`<div class="nm" style="color:var(--sub)" title="${esc(p.name)}"><span class="dot" style="background:${c};border-radius:2px"></span><span style="overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span></div>`,m))});
  return `<div class="tl" style="display:flex;margin-top:24px"><div class="nmw"></div><div style="flex:1;position:relative;height:0">${head}</div></div><div class="tlw">${out.join('')}</div>`}
function layoutTimelines(){
  document.querySelectorAll('.lane .tr').forEach(tr=>{
    const W=tr.clientWidth;if(!W)return;const RH=21;const ends=[];
    [...tr.querySelectorAll('.mk')].sort((a,b)=>a.dataset.x-b.dataset.x).forEach(m=>{
      m.classList.remove('flip');const x=W*m.dataset.x/100,w=m.offsetWidth;
      let l=x-5,r=l+w;if(r>W-2){m.classList.add('flip');l=x+5-w;r=x+5}
      let i=ends.findIndex(e=>e<l-6);if(i<0){i=ends.length;ends.push(0)}ends[i]=r;m.style.top=(5+i*RH)+'px'});
    const bars=[...tr.querySelectorAll('.bar')];const h=Math.max(46,10+Math.max(1,ends.length)*RH+(bars.length?10:0));
    tr.parentElement.style.height=h+'px';
    bars.forEach(bb=>bb.style.top=(h-(bb.classList.contains('doingb')?9:15))+'px')})}

function heartbeatHTML(b,detailed){
  const ord={active:0,unknown:1,parked:2,completed:3};
  const age=p=>p.last_evidenced_work?-diff(p.last_evidenced_work.date):999;
  const all=(b.projects||[]).slice().sort((x,y)=>(ord[x.state]??4)-(ord[y.state]??4)||age(x)-age(y));
  const ids=new Set(all.map(p=>p.id));
  const kids=p=>all.filter(c=>c.parent_id===p.id);
  const roots=all.filter(p=>!p.parent_id||!ids.has(p.parent_id));
  const hbRow=(p,child)=>{const lw=p.last_evidenced_work;const n=lw?-diff(lw.date):null;
    const c=n==null?'var(--muted)':n<=7?'var(--ok)':n<=21?'var(--warn)':'var(--bad)';
    const tipT=[p.state_note,lw?'Last evidenced work: '+lw.source+' ('+fmt(lw.date)+')':'No evidenced activity date',p.next?'Next ('+(p.next.basis||'')+'): '+p.next.text:'',p.note_path&&APP?'Click to open in Obsidian':''].filter(Boolean).join('\n');
    const line=`<div class="hb ${child?'child':''}" style="${p.note_path&&APP?'cursor:pointer':''}" title="${esc(tipT)}" ${p.note_path&&APP?`data-note="${esc(p.note_path)}"`:''}>
      <span class="dot" style="background:${color(b,p.area)}"></span><span class="n" style="color:${p.state==='active'?'var(--text)':'var(--muted)'}">${child?'↳ ':''}${esc(p.name)}</span>
      <div class="track">${n==null?'':`<div style="width:${Math.min(100,Math.max(3,n/42*100))}%;height:5px;border-radius:3px;background:${c}"></div>`}</div>
      <span class="v">${n==null?'unknown':n===0?'today':n+'d ago'}</span></div>`;
    if(!detailed)return line;
    const meta=[p.next?`Next: ${esc(p.next.text)}${p.next.basis==='recommendation'?' <span class="tag sg">suggested</span>':p.next.basis==='inference'?' <span class="tag">inferred</span>':''}`:'',p.state&&p.state!=='active'?esc(p.state)+(p.state_note?' · '+esc(p.state_note):''):p.state_note?esc(p.state_note):'',lw?`Last work: ${esc(lw.source)}`:''].filter(Boolean);
    return `<div class="hbx">${line}${meta.map(m=>`<div class="meta" style="${child?'padding-left:28px':''}">${m}</div>`).join('')}</div>`};
  const tree=list=>list.map(p=>hbRow(p,false)+kids(p).map(k=>hbRow(k,true)).join('')).join('');
  const known=roots.filter(p=>p.state==='active'||p.last_evidenced_work||kids(p).some(k=>k.last_evidenced_work)),unk=roots.filter(p=>!known.includes(p));
  return (tree(known)+(unk.length?`<details><summary>No activity date or status (${unk.length})</summary>${tree(unk)}</details>`:''))||'<div class="empty">No projects in snapshot.</div>'}

function vTimeline(b){return timelineHTML(b,{back:1,weeks:6})+LEGEND+`<h2><span>Project heartbeat · days since last evidenced work</span></h2>`+heartbeatHTML(b,false)}

function decisionsHTML(b,compact){const d=b.decisions||[];if(!d.length)return '';
  return `<h2><span>Needs your decision</span><span>${d.length}</span></h2><div class="box">`+d.map(x=>`<div class="row" title="${esc([x.why,x.status_as_of?'As of '+fmt(x.status_as_of):'',...(x.sources||[]).map(s=>'Source: '+s.ref+(s.date?' ('+fmt(s.date)+')':''))].filter(Boolean).join('\n'))}"><span class="dot" style="background:var(--warn)"></span><div class="t">${esc(x.question)}${x.basis==='recommendation'?'<span class="tag sg">suggested</span>':''}${!compact&&(x.options||[]).length?`<div class="sub">${x.options.map(esc).join(' · ')}</div>`:''}${!compact&&x.why?`<div class="sub">${esc(x.why)}</div>`:''}</div>${x.due?`<span class="pill ${diff(x.due)<=3?'warn':''}">${fmt(x.due)}</span>`:''}</div>`).join('')+'</div>'}

function readingHTML(b){const r=b.reading||[];if(!r.length)return '';
  const auth=a=>Array.isArray(a)?a.join(', '):a||'';
  return `<h2><span>Reading</span><span>${r.length}</span></h2>`+r.map(x=>{const link=x.url||x.zotero_url;
    return `<div class="row" title="${esc([x.why,x.recommended_at?'Recommended '+fmt(x.recommended_at):'',...(x.sources||[]).map(s=>'Source: '+s.ref+(s.date?' ('+fmt(s.date)+')':''))].filter(Boolean).join('\n'))}"><div class="t">${link?`<a class="ext" data-url="${esc(link)}">${esc(x.title)}</a>`:esc(x.title)}${x.authors?`<div class="sub">${esc(auth(x.authors))}${x.published?' · '+esc(String(x.published).slice(0,4)):''}</div>`:''}${x.why?`<div class="sub">${esc(x.why)}</div>`:''}</div>${x.url&&x.zotero_url?`<a class="ext sub" data-url="${esc(x.zotero_url)}">Zotero</a>`:''}</div>`}).join('')}

function changesHTML(b,prev){
  const head=t=>`<h2><span title="Compared with the previous snapshot this app saw, not necessarily yesterday">${t}</span>`;
  if(!prev||!prev.tasks)return head('Changed since previous snapshot')+`</h2><div class="empty">Shown once the app has seen two snapshots.</div>`;
  const pm=Object.fromEntries(prev.tasks.map(t=>[t.id,t])),cm=new Set((b.tasks||[]).map(t=>t.id));
  const items=[];
  (b.tasks||[]).forEach(t=>{const o=pm[t.id];
    if(!o){items.push([t,'new']);return}
    if(o.state!==t.state)items.push([t,`${o.state} → ${t.state}`]);
    else if((o.due||'')!==(t.due||''))items.push([t,o.due?`due ${fmt(o.due)} → ${t.due?fmt(t.due):'none'}`:`now due ${fmt(t.due)}`]);
    else if((o.event_at||'')!==(t.event_at||''))items.push([t,`event date changed`])});
  const gone=prev.tasks.filter(t=>!cm.has(t.id));
  const h=head(`Changed since ${fmtTime(prev.generated_at)}`)+`<span>${items.length+gone.length}</span></h2>`;
  if(!items.length&&!gone.length)return h+'<div class="empty">No changes.</div>';
  return h+items.map(([t,c])=>row(b,t,`<div class="sub">${esc(c)}</div>`)).join('')+gone.map(t=>`<div class="row"><span class="dot" style="background:var(--muted)"></span><div class="t" style="color:var(--muted)">${esc(t.title)}<div class="sub">no longer listed — not marked done</div></div></div>`).join('')}

function tableHTML(b){
  const tasks=b.tasks||[];const fbOn=!!(payload&&payload.feedbackEnabled);
  const inArea=t=>fArea==='all'||t.area===fArea;
  const match=(t,s)=>s==='all'||(s==='open'?OPEN(t)&&!SUGG(t):s==='suggested'?OPEN(t)&&SUGG(t):t.state===s);
  const key=t=>fSort==='due'?(t.due||t.event_at||'9999'):fSort==='age'?(t.status_as_of||t.open_since||'0000'):t.title.toLowerCase();
  const rows=tasks.filter(t=>inArea(t)&&match(t,fState)).sort((x,y)=>key(x)<key(y)?-1:key(x)>key(y)?1:0);
  const n=s=>tasks.filter(t=>inArea(t)&&match(t,s)).length;
  const chips=(name,cur,opts)=>opts.map(([v,l])=>`<button class="chip ${cur===v?'on':''}" data-f="${name}" data-v="${v}">${esc(l)}</button>`).join('');
  const states=[['open','Open'],['unknown','Status ?'],['todo','To do'],['doing','Doing'],['waiting','Waiting'],['suggested','Suggested'],['deferred','Deferred'],['done','Done'],['all','All']].filter(([v])=>v==='open'||v==='all'||n(v)).map(([v,l])=>[v,`${l} ${n(v)}`]);
  const sel=t=>fbOn?`<select class="fb" data-task="${esc(t.id)}" title="Tell the curator this item's real status"><option value="">Set status…</option>${ACTIONS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>`:'';
  return `<h2><span>All items</span><span>${rows.length}</span></h2>
  <div class="chips">${chips('area',fArea,[['all','All areas'],...Object.keys(b.areas||{}).map(a=>[a,areaLabel(b,a)])])}</div>
  <div class="chips">${chips('state',fState,states)}<span style="flex:1"></span>${chips('sort',fSort,[['due','By date'],['age','Oldest status'],['title','A–Z']])}</div>
  <div class="tr2 head"><span></span><span>Item</span><span>State</span><span style="text-align:right" title="Days since the state was last confirmed">Age</span><span style="text-align:right">Date</span><span>${fbOn?'Update':''}</span></div>
  ${rows.map(t=>`<div class="tr2 ${t.note_path&&APP?'link':''}" title="${tip(t)}" ${t.note_path&&APP?`data-note="${esc(t.note_path)}"`:''}><span class="dot" style="background:${color(b,t.area)}"></span><span class="tt">${esc(t.title)}${tags(t,true)}${cbtn(t)}</span><span class="st st-${esc(t.state)}">${esc(t.state==='unknown'?'status ?':t.state)}</span><span class="age">${t.status_as_of?(-diff(t.status_as_of))+'d':''}</span><span class="dd">${dueChip(t)}</span><span>${OPEN(t)||t.state==='done'?sel(t):''}</span></div>`).join('')||'<div class="empty">Nothing matches.</div>'}
  ${fbOn?'<div class="sub" style="margin-top:6px">Status updates go to the curator and apply at its next run. They don’t edit your notes.</div>':''}`}

function coverageHTML(b){const c=b.coverage||[];if(!c.length)return '';
  const col={checked:'var(--ok)',partial:'var(--warn)',unavailable:'var(--bad)',not_configured:'var(--muted)'};
  return `<h2><span>Sources this run</span></h2>`+c.map(x=>`<div class="cvl" title="${esc(x.note||'')}"><span class="dot" style="width:7px;height:7px;margin-top:5px;background:${col[x.status]||'var(--muted)'}"></span><span>${esc(x.source)}</span><span style="color:var(--muted)">${esc(x.status.replace('_',' '))}${x.checked_at?' · '+esc(fmtTime(x.checked_at)):''}${x.note?' · '+esc(x.note):''}</span></div>`).join('')}

function openCount(b){const t=b.tasks||[];const o=t.filter(x=>OPEN(x)&&!SUGG(x)).length,s=t.filter(x=>OPEN(x)&&SUGG(x)).length;return `${o} open${s?` · ${s} suggested`:''}`}
function vFull(b){
  const now=new Date();
  const nq=triagePool(b,'unknown').length;
  const btns=`<div class="btns"><button class="btn" data-act="triage" title="Review items one by one">Triage${nq?' '+nq:''} <kbd>T</kbd></button>${APP?'<button class="btn" data-act="fullscreen">Full screen</button><button class="btn" data-act="reload">Reload</button>':'<button class="btn" data-act="collapse">Compact view</button>'}</div>`;
  return `<div class="fhead"><div style="min-width:0;flex:1"><div style="font-size:20px;font-weight:600">${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} <span class="sub" style="font-size:12px;font-weight:400">${openCount(b)} · updated ${fmtTime(b.generated_at)}</span></div>${questionHTML(b)}</div>${btns}</div>
  <div class="full"><section>${decisionsHTML(b)}${vToday(b,{noBrief:true,noRest:true,noDecisions:true})}${changesHTML(b,payload.previous)}</section>
    <section><h2><span>Timeline · 10 weeks</span></h2>${timelineHTML(b,{back:2,weeks:10,milestones:true})}${LEGEND}${tableHTML(b)}</section>
    <section>${b.brief?`<details class="brief"><summary>Morning summary</summary><div style="margin-top:6px;font-size:12.5px;color:var(--sub)">${esc(b.brief)}</div></details>`:''}<h2><span>Projects · days since last evidenced work</span></h2>${heartbeatHTML(b,true)}${readingHTML(b)}${coverageHTML(b)}</section></div>`}

function shiftFixture(p){const b=p&&p.board;if(!b||!b.fixture||b._shifted)return p;
  const off=Math.round((today()-day(b.generated_at))/864e5);if(!off)return p;
  const sh=v=>{if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}/.test(v))return v;const d=new Date(v.length===10?v+'T12:00:00':v);d.setDate(d.getDate()+off);
    return v.length===10?d.toLocaleDateString('en-CA'):v.replace(/^\d{4}-\d{2}-\d{2}/,d.toLocaleDateString('en-CA'))};
  const walk=o=>{if(Array.isArray(o))return o.map(walk);if(o&&typeof o==='object'){for(const k in o)o[k]=/^(due|event_at|since|open_since|status_as_of|date|generated_at|next_refresh_at|checked_at|achieved_at|recommended_at|recorded_at|processed_at)$/.test(k)?sh(o[k]):walk(o[k]);}return o};
  walk(b);if(p.previous)walk(p.previous);b._shifted=true;return p}

let TR=null,TRseen=0,TRlocal=[];
const TACT={todo:['Still on','Space'],cancelled:['Cancel task','⌫'],done:['Done','↵'],waiting:['Waiting','W'],doing:['In progress','I']};
const statusAge=t=>t.status_as_of?-diff(t.status_as_of):(t.open_since?-diff(t.open_since):999);
function hasPending(id){if(TRlocal.some(e=>e.task_id===id&&e.action!=='comment'))return true;const f=feedbackFor(id);return !!(f&&!f.rc)}
function triagePool(b,mode){const t=(b.tasks||[]).filter(x=>OPEN(x)&&!SUGG(x)&&!hasPending(x.id));
  const q=mode==='unknown'?t.filter(x=>x.state==='unknown'):mode==='stale'?t.filter(x=>statusAge(x)>14):t;
  return q.sort((a,c)=>statusAge(c)-statusAge(a)).map(x=>x.id)}
function startTriage(mode){const b=payload&&payload.board;if(!b)return;
  if(!mode)mode=['unknown','stale','all'].find(m=>triagePool(b,m).length)||'unknown';
  TR={mode,queue:triagePool(b,mode),pos:0,answers:{},notes:{},log:[],noteOpen:false};render()}
function endTriage(){flushFeedback();TR=null;render()}
function commitEvent(e){clearTimeout(e.timer);if(e.sent)return;e.sent=true;TRlocal=TRlocal.filter(x=>x!==e);
  if(APP)post({feedback:{task_id:e.task_id,action:e.action,previous_state:e.previous_state,snapshot_generated_at:e.snapshot_generated_at,note:e.note}});if(TR)updateBadges()}
window.flushFeedback=()=>{TRlocal.slice().forEach(commitEvent)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushFeedback()});
const circular=()=>TR.queue.length>=5;
function curIdx(){const n=TR.queue.length;if(!n)return -1;const r=Math.round(TR.pos);return circular()?((r%n)+n)%n:Math.max(0,Math.min(n-1,r))}
function curTask(){const i=curIdx();return i<0?null:(payload.board.tasks||[]).find(x=>x.id===TR.queue[i])}
function decide(action){const t=curTask();if(!t)return;const b=payload.board;
  const prev=TR.answers[t.id];if(prev&&!prev.e.sent){clearTimeout(prev.e.timer);TRlocal=TRlocal.filter(x=>x!==prev.e)}
  const e={task_id:t.id,action,previous_state:t.state,snapshot_generated_at:b.generated_at,note:(TR.notes[t.id]||'').trim(),sent:false};
  e.timer=setTimeout(()=>commitEvent(e),5000);TRlocal.push(e);
  TR.log.push({id:t.id,prev:prev&&!prev.e.sent?null:prev});TR.answers[t.id]={action,e};delete TR.notes[t.id];closeNote();
  updateBadges();nextUnanswered()}
function nextUnanswered(){const n=TR.queue.length,c=curIdx();
  for(let k=1;k<=n;k++){const i=circular()?(c+k)%n:c+k;if(i>=n)break;if(!TR.answers[TR.queue[i]])return goTo(Math.round(TR.pos)+k)}
  if(c<n-1||circular())goTo(Math.round(TR.pos)+1);else updateBadges()}
function goTo(p,instant){if(!circular())p=Math.max(0,Math.min(TR.queue.length-1,p));TR.pos=p;positionWheel(!instant);updateBadges()}
function undo(){const last=TR.log.pop();if(!last)return;const a=TR.answers[last.id];
  if(a&&!a.e.sent){clearTimeout(a.e.timer);TRlocal=TRlocal.filter(x=>x!==a.e);if(a.e.note)TR.notes[last.id]=a.e.note;toast('Undone')}else if(a)toast('Already sent. Choose again and the newer status wins.');
  if(last.prev)TR.answers[last.id]=last.prev;else delete TR.answers[last.id];
  const i=TR.queue.indexOf(last.id),n=TR.queue.length,c=curIdx();let d=i-c;if(circular()){d=((d%n)+n)%n;if(d>n/2)d-=n}
  goTo(Math.round(TR.pos)+d)}
function wheelOffset(i){const n=TR.queue.length;let d=i-TR.pos;if(circular()){d=((d%n)+n)%n;if(d>n/2)d-=n}return d}
function positionWheel(animate){const w=document.getElementById('wheel');if(!w)return;w.classList.toggle('snap',!!animate);
  const cards=[...w.querySelectorAll('.tcard')];const ci=curIdx();
  cards.forEach(c=>c.classList.toggle('cur',+c.dataset.i===ci));
  const cur=cards.find(c=>+c.dataset.i===ci),mini=cards.find(c=>+c.dataset.i!==ci);
  const curW=cur?cur.offsetWidth:600,miniW=mini?mini.offsetWidth:280,curH=cur?cur.offsetHeight:260;
  w.style.height=(curH+48)+'px';
  const near=curW/2+20+miniW*0.46,far=miniW*0.82;
  cards.forEach(c=>{const d=wheelOffset(+c.dataset.i),a=Math.abs(d);
    if(a>2.6){c.style.visibility='hidden';c.style.opacity='0';return}
    const x=Math.sign(d)*(a<=1?a*near:near+(a-1)*far);
    c.style.visibility='visible';c.style.zIndex=String(100-Math.round(a*10));
    c.style.transform=`translate(-50%,-50%) translateX(${x}px) rotateY(${-Math.sign(d)*Math.min(a,3)*16}deg) scale(${1-Math.min(a,3)*0.08})`;
    const op=[1,.6,.25,0];const lo=Math.floor(Math.min(a,3)),hi=Math.min(3,lo+1),f=Math.min(a,3)-lo;
    c.style.opacity=String(op[lo]+(op[hi]-op[lo])*f);c.style.pointerEvents=a<2.5?'auto':'none'});
  const pc=document.getElementById('tpos');if(pc&&ci>=0)pc.textContent=`${ci+1} of ${TR.queue.length}`}
function badgeHTML(id){const a=TR.answers[id];let s='';
  if(a)s+=`<span class="pill ${a.action==='cancelled'?'bad':a.action==='done'?'okp':''}">${TACT[a.action][0]} · ${a.e.sent?'pending curator':'sending…'}</span>`;
  if(TR.notes[id])s+=`<span class="pill" title="${esc(TR.notes[id])}">note: ${esc(TR.notes[id].length>28?TR.notes[id].slice(0,28)+'…':TR.notes[id])}</span>`;
  return s}
function updateBadges(){if(!TR)return;document.querySelectorAll('.tcard').forEach(c=>{const id=TR.queue[+c.dataset.i];const bd=c.querySelector('.tbadge');if(bd)bd.innerHTML=badgeHTML(id)});
  const n=TR.queue.length,done=Object.keys(TR.answers).length,pg=document.querySelector('.prog>div');if(pg)pg.style.width=(n?done/n*100:100)+'%';
  const sm=document.getElementById('tsum');if(sm){const tally={};Object.values(TR.answers).forEach(a=>tally[a.action]=(tally[a.action]||0)+1);
    sm.innerHTML=done?`${done} answered${done===n&&n?' — all done':''}: ${Object.entries(tally).map(([a,c])=>`${TACT[a][0]} ${c}`).join(' · ')}`:'Answer with the keys below; swipe sideways or use ← → to move.'}
  const u=document.querySelector('[data-act="tundo"]');if(u)u.disabled=!TR.log.length}
function cardHTML(b,t,i){const proj=(b.projects||[]).find(p=>p.id===t.project_id);const age=statusAge(t);
  const facts=[t.due?`Due ${fmt(t.due)} (${rel(t.due)})`:'',t.event_at?`Event ${fmt(t.event_at)} (${rel(t.event_at)})`:'',`Status: ${t.state==='unknown'?'unknown':t.state}${age<999?` · last confirmed ${age===0?'today':age+' days ago'}`:''}`,t.waiting_on?`Waiting on ${t.waiting_on}${t.since?' since '+fmt(t.since):''}`:'',t.open_since?`Captured ${fmt(t.open_since)}`:'',proj?`Project: ${proj.name}`:''].filter(Boolean);
  return `<div class="tcard" data-i="${i}"><div class="tbadge"></div>
    <div class="sub"><span class="dot" style="background:${color(b,t.area)};margin-right:6px"></span>${esc(areaLabel(b,t.area))}${t.priority==='high'?' · high priority':''}${t.basis==='inference'?' · inferred':''}</div>
    <div class="ttl">${esc(t.title)}</div><div class="det">
    ${t.why?`<div class="twhy">${esc(t.why)}</div>`:''}
    ${facts.map(f=>`<div class="hl sub" style="font-size:12.5px">${esc(f)}</div>`).join('')}
    ${(t.sources||[]).length?`<div class="sub" style="margin-top:6px">${(t.sources||[]).map(s=>esc(s.ref+(s.date?' · '+fmt(s.date):''))).join('<br>')}</div>`:''}
    ${commentsFor(t.id).map(c=>`<div class="cmt"><div>${esc(c.e.note)}</div><div class="sub">your comment · ${c.rc?'reviewed':'for review at '+esc(nextRun())}</div></div>`).join('')}
    ${t.note_path&&APP?`<div style="margin-top:10px"><a class="ext" data-note="${esc(t.note_path)}">Open note <kbd>O</kbd></a></div>`:''}</div></div>`}
function vTriage(b){
  const counts={unknown:triagePool(b,'unknown').length,stale:triagePool(b,'stale').length,all:triagePool(b,'all').length};
  const modes=[['unknown','Status ?'],['stale','Status older than 2 weeks'],['all','All open']].map(([v,l])=>`<button class="chip ${TR.mode===v?'on':''}" data-tmode="${v}">${l} ${v===TR.mode?TR.queue.length:counts[v]}</button>`).join('');
  const n=TR.queue.length;
  let h=`<div class="tri"><div class="fhead"><div style="flex:1;min-width:0"><div style="font-size:20px;font-weight:600">Triage <span class="sub" id="tpos" style="font-size:13px;font-weight:400"></span></div><div class="sub" id="tsum"></div></div><div class="btns"><button class="btn" data-act="endtriage">Finish <kbd>Esc</kbd></button></div></div>
    <div class="chips" style="margin-top:8px">${modes}</div><div class="prog"><div></div></div>`;
  if(!n)return h+`<div class="empty" style="text-align:center;padding:60px 0">Nothing to review in this list.</div></div>`;
  h+=`<div class="wheel" id="wheel">${TR.queue.map((id,i)=>cardHTML(b,(b.tasks||[]).find(x=>x.id===id),i)).join('')}</div>
    <div class="tnotebar" id="tnotebar" ${TR.noteOpen?'':'hidden'}><input id="tnote" placeholder="Note to send with your answer, e.g. paid on Oct 25 — Enter to keep, Esc to discard"></div>
    <div class="tbtns">${['cancelled','waiting','doing','done','todo'].map(a=>`<button class="btn tb tb-${a}" data-decide="${a}">${TACT[a][0]} <kbd>${TACT[a][1]}</kbd></button>`).join('')}</div>
    <div class="tbtns" style="margin-top:6px"><button class="btn" data-act="tprev">Previous <kbd>←</kbd></button><button class="btn" data-act="tnext">Next <kbd>→</kbd></button><button class="btn" data-act="tnote">Note <kbd>N</kbd></button><button class="btn" data-act="tcomment">Comment <kbd>C</kbd></button><button class="btn" data-act="tundo">Undo <kbd>⌘Z</kbd></button></div>`;
  return h+'</div>'}
function openNote(){const t=curTask();if(!t)return;TR.noteOpen=true;const bar=document.getElementById('tnotebar'),inp=document.getElementById('tnote');if(!bar)return;
  bar.hidden=false;inp.value=TR.notes[t.id]||'';inp.dataset.task=t.id;inp.focus()}
function closeNote(keep){const bar=document.getElementById('tnotebar'),inp=document.getElementById('tnote');if(!bar||bar.hidden){if(TR)TR.noteOpen=false;return}
  const id=inp.dataset.task;if(keep&&id){const v=inp.value.trim();if(v)TR.notes[id]=v;else delete TR.notes[id]}
  bar.hidden=true;TR.noteOpen=false;inp.blur();updateBadges()}
function triageComment(){const t=curTask();if(!t)return;const note=TR.notes[t.id];
  if(note){if(!APP)return toast('Comments need the BoardBar app.',true);delete TR.notes[t.id];window._pendingComment=true;
    post({feedback:{task_id:t.id,action:'comment',note,previous_state:t.state,snapshot_generated_at:payload.board.generated_at}});updateBadges();return}
  openComment(t.id,document.querySelector('.tcard.cur'))}
function bindTriage(){
  document.querySelectorAll('[data-decide]').forEach(e=>e.onclick=()=>decide(e.dataset.decide));
  document.querySelectorAll('[data-tmode]').forEach(e=>e.onclick=()=>{flushFeedback();startTriage(e.dataset.tmode)});
  const w=document.getElementById('wheel');if(!w){updateBadges();return}
  positionWheel(false);updateBadges();
  w.querySelectorAll('.tcard').forEach(c=>c.onclick=ev=>{if(ev.target.closest('a'))return;const d=wheelOffset(+c.dataset.i);if(Math.abs(d)>=0.5)goTo(Math.round(TR.pos+d))});
  const inp=document.getElementById('tnote');
  inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();closeNote(true)}else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();inp.value='';closeNote(false)}};
  let st=null;
  w.onwheel=ev=>{ev.preventDefault();if(TR.noteOpen)closeNote(true);const dlt=Math.abs(ev.deltaX)>=Math.abs(ev.deltaY)?ev.deltaX:ev.deltaY;
    TR.pos+=dlt/(ev.deltaMode===1?3:110);if(!circular())TR.pos=Math.max(-0.4,Math.min(TR.queue.length-0.6,TR.pos));
    positionWheel(false);clearTimeout(st);st=setTimeout(()=>goTo(Math.round(TR.pos)),130)};
  addEventListener('resize',()=>{if(TR)positionWheel(false)})}
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){const p=document.getElementById('cbox');if(p&&!p.hidden){ev.preventDefault();return closeComment()}}
  const inField=!!(ev.target&&ev.target.closest&&ev.target.closest('textarea,input,select'));
  if(!TR){if(isFull()&&(ev.key==='t'||ev.key==='T')&&!ev.metaKey&&!inField){ev.preventDefault();startTriage()}return}
  if(inField)return;
  const k=ev.key;
  if((ev.metaKey||ev.ctrlKey)&&(k==='z'||k==='Z')){ev.preventDefault();return undo()}
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const map={' ':'todo','Backspace':'cancelled','Delete':'cancelled','Enter':'done','w':'waiting','W':'waiting','i':'doing','I':'doing'};
  if(map[k]){ev.preventDefault();return decide(map[k])}
  if(k==='ArrowDown'||k==='ArrowRight'||k==='j'||k==='J'){ev.preventDefault();return goTo(Math.round(TR.pos)+1)}
  if(k==='ArrowUp'||k==='ArrowLeft'||k==='k'||k==='K'){ev.preventDefault();return goTo(Math.round(TR.pos)-1)}
  if(k==='Escape'){ev.preventDefault();return endTriage()}
  if(k==='o'||k==='O'){const t=curTask();if(t&&t.note_path&&APP)post({open:t.note_path});return}
  if(k==='n'||k==='N'){ev.preventDefault();return openNote()}
  if(k==='c'||k==='C'){ev.preventDefault();return triageComment()}});

function render(p){
  if(p)p=shiftFixture(p);
  if(p&&TR&&isFull()&&document.getElementById('wheel')){payload=p;updateBadges();return}
  payload=p||payload;HOV=[];hideHov();
  const b=payload&&payload.board,h=payload&&payload.health;
  const app=document.getElementById('app');const full=isFull();
  document.body.classList.toggle('isfull',full);
  if(!b){app.innerHTML=healthBanner(h||{state:'missing',message:'No board snapshot yet.'})+'<div class="empty">The morning curator writes <code>board.json</code>. Nothing to show until then.</div>'+foot(null,h);bind();return}
  let html=healthBanner(h,b);
  if(b.fixture)html+='<div class="banner warn">Example data — not a real curator snapshot</div>';
  if(full&&payload.triageRequest>TRseen){TRseen=payload.triageRequest;if(!TR)setTimeout(()=>startTriage(),0)}
  if(full)html+=TR?vTriage(b):vFull(b);
  else{const nd=(b.decisions||[]).length;
    html+=`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-size:15px;font-weight:600;white-space:nowrap">${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span><span style="flex:1"></span><span class="sub">${openCount(b)}${nd?` · ${nd} decision${nd>1?'s':''}`:''}</span>${payload.feedbackEnabled!==false&&triagePool(b,'unknown').length?`<button class="iconbtn" data-act="triage" title="Review unconfirmed items one by one">Triage ${triagePool(b,'unknown').length}</button>`:''}<button class="iconbtn" data-act="expand" title="Open the full board (or double-click anywhere)">Expand ↗</button></div>`;
    html+=`<div class="tabs"><button data-tab="today" class="${tab==='today'?'on':''}">Today</button><button data-tab="timeline" class="${tab==='timeline'?'on':''}">Timeline</button></div>`;
    html+=tab==='timeline'?vTimeline(b):vToday(b)}
  app.innerHTML=html+(TR&&full?'':foot(b,h));bind();if(TR&&full)bindTriage();else layoutTimelines()}
function foot(b,h){
  const cov=b&&b.coverage?b.coverage.map(c=>{const col={checked:'var(--ok)',partial:'var(--warn)',unavailable:'var(--bad)',not_configured:'var(--muted)'}[c.status]||'var(--muted)';
    return `<span class="cov" title="${esc(c.source+': '+c.status.replace('_',' ')+(c.note?' — '+c.note:'')+(c.checked_at?' · '+fmtTime(c.checked_at):''))}"><span class="dot" style="width:6px;height:6px;background:${col}"></span>${esc(c.source.split(' (')[0])}</span>`}).join(''):'';
  return `<div class="foot">${b?`<span>Updated ${fmtTime(b.generated_at)}${b.next_refresh_at?' · next '+fmtTime(b.next_refresh_at):''}</span>`:''}<span style="flex-basis:100%;height:0"></span>${cov}${APP?'<span style="flex:1"></span><a data-act="reload">Reload</a><a data-act="openfile">JSON</a><a data-act="quit">Quit</a>':''}</div>`}

function hov(){let e=document.getElementById('hov');if(!e){e=document.createElement('div');e.id='hov';e.hidden=true;document.body.appendChild(e)}return e}
function hideHov(){const e=document.getElementById('hov');if(e)e.hidden=true}
function showHov(i,ev){const d=HOV[i];if(!d)return;const e=hov();
  e.innerHTML=`<div class="ht"><span class="dot" style="background:${d.color};margin-right:6px"></span>${esc(d.title)}</div>${d.lines.map(l=>`<div class="hl">${esc(l)}</div>`).join('')}`;
  e.hidden=false;const pad=14,r=e.getBoundingClientRect();
  let x=ev.clientX+pad,y=ev.clientY+pad;if(x+r.width>innerWidth-8)x=ev.clientX-r.width-pad;if(y+r.height>innerHeight-8)y=ev.clientY-r.height-pad;
  e.style.left=Math.max(8,x)+'px';e.style.top=Math.max(8,y)+'px'}
function toast(msg,err){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className=err?'err':'';t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,err?8000:3500)}
window.feedbackResult=r=>{if(window._pendingComment){window._pendingComment=false;if(r&&r.ok){closeComment();return toast('Comment saved. The curator reviews it at '+nextRun()+'.')}const er=document.getElementById('cerr');if(er){er.textContent='Couldn’t save: '+((r&&r.error)||'unknown error');er.hidden=false}return}if(TR&&r&&r.ok)return;toast(r&&r.ok?'Saved. The curator applies it at its next run.':'Couldn’t save: '+((r&&r.error)||'unknown error'),!(r&&r.ok))};

function expand(){if(APP&&window.BOARD_MODE!=='full')post({act:'expand'});else{localFull=true;render()}}
function act(a){if(a==='expand')return expand();if(a==='collapse'){localFull=false;return render()}
  if(a==='triage'){if(isFull())return startTriage();if(APP)return post({act:'triage'});localFull=true;return startTriage()}
  if(a==='endtriage')return endTriage();if(a==='tundo')return undo();if(a==='tnote')return openNote();if(a==='tcomment')return triageComment();
  if(a==='tnext')return goTo(Math.round(TR.pos)+1);if(a==='tprev')return goTo(Math.round(TR.pos)-1);
  post({act:a})}
function bind(){
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;try{localStorage.setItem('tab',tab)}catch(x){}render()});
  document.querySelectorAll('[data-note]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('select,.cbtn'))return;post({open:e.dataset.note})});
  document.querySelectorAll('[data-url]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();APP?post({url:e.dataset.url}):window.open(e.dataset.url,'_blank','noopener')});
  document.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>act(e.dataset.act));
  document.querySelectorAll('[data-comment]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openComment(e.dataset.comment,e)});
  document.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{const v=e.dataset.v;if(e.dataset.f==='area')fArea=v;else if(e.dataset.f==='state')fState=v;else fSort=v;render()});
  document.querySelectorAll('[data-hi]').forEach(e=>{e.onmousemove=ev=>showHov(+e.dataset.hi,ev);e.onmouseleave=hideHov;
    const d=HOV[+e.dataset.hi];if(d&&d.note&&APP)e.onclick=()=>post({open:d.note})});
  document.querySelectorAll('select.fb').forEach(s=>{s.onclick=ev=>ev.stopPropagation();s.onchange=()=>{const a=s.value;if(!a)return;
    const b=payload.board,t=(b.tasks||[]).find(x=>x.id===s.dataset.task);s.value='';
    if(!APP){toast('Status updates need the BoardBar app.',true);return}
    post({feedback:{task_id:t.id,action:a,previous_state:t.state,snapshot_generated_at:b.generated_at,note:''}})}})}
document.addEventListener('mousedown',e=>{const p=document.getElementById('cbox');if(p&&!p.hidden&&e.target.closest&&!e.target.closest('#cbox,.cbtn,[data-act="tcomment"]'))closeComment()});
document.addEventListener('dblclick',e=>{if(!TR&&!isFull()&&e.target.closest&&!e.target.closest('.row,.hb,button,a,summary,.mk,select'))expand()});
let wasFull=null;addEventListener('resize',()=>{if(!payload)return;const f=isFull();if(!window.BOARD_MODE&&f!==wasFull){wasFull=f;render()}else layoutTimelines()});
window.render=render;
function webHealth(b){const now=Date.now();
  if(b.fixture)return {state:'ok'};
  if(b.next_refresh_at)return now>new Date(b.next_refresh_at).getTime()+3*36e5?{state:'stale',message:'Expected refresh has not arrived'}:{state:'ok'};
  return now-new Date(b.generated_at).getTime()>36*36e5?{state:'stale',message:'Snapshot is older than 36h'}:{state:'ok'}}
if(!APP){
  const qs=new URLSearchParams(location.search);const src=qs.get('board')||'board.json',prevSrc=qs.get('previous');
  Promise.all([fetch(src).then(r=>r.json()),prevSrc?fetch(prevSrc).then(r=>r.json()).catch(()=>null):null])
    .then(([board,previous])=>render({board,previous,health:webHealth(board)}))
    .catch(e=>render({board:null,health:{state:'invalid',message:'Could not load '+src}}))}
else post({act:'ready'});
</script>
